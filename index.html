<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>断末蚊</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gameParts.css">
    <link rel="stylesheet" href="effect.css">
</head>

<body>

<div id="gameArea">

    <div id="background"></div>

    <!-- タイトル画面 -->
    <div id="titleScreen"></div>

    <!-- ゲームヘッダー -->
    <div id="gameHeader">

        <!-- 音ON/OFF -->
        <div id="soundButton">
            🔇
        </div>

        <!-- 設定 -->
        <div id="settingButton" style="display:none;">
            ⚙
        </div>

        <!-- スコア -->
        <div id="score" style="display:none;">
            <span class="score-label">スコア：</span>
            <span id="scoreValue">00000000</span>
        </div>

        <!-- かゆみ耐性 -->
        <div id="damage" style="display:none;">
            <span class="damage-label">かゆみ耐性：</span>
            <span class="heart">
                <span id="heart1">❤</span>
                <span id="heart2">❤</span>
                <span id="heart3">❤</span>
            </span>
        </div>

        <!-- 一時停止 -->
        <div id="pauseButton" style="display:none;">
            ⏸
        </div>

    </div>

    <!-- セリフ履歴 -->
    <div id="dialogueHistory"></div>

    <!-- ゲームオーバー -->
    <div id="gameOverScreen"></div>

    <!-- フェード -->
    <div id="fadeLayer"></div>

    <!-- スタッフロール -->
    <div id="staffRoll"></div>

</div>

<!-- JavaScript -->

<!-- 設定 -->
<script src="js/config.js"></script>

<!-- サウンド管理 -->
<script src="js/sound.js"></script>

<!-- 共通処理 -->
<script src="js/utils.js"></script>

<!-- タイトル画面 -->
<script src="js/title.js"></script>

<!-- セリフデータ -->
<script src="js/dialogue.js"></script>

<!-- セリフ履歴 -->
<script src="js/dialogueHistory.js"></script>

<!-- 蚊データ -->
<script src="js/mosquito.js"></script>

<!-- セリフ制御 -->
<script src="js/mosquitoDialogue.js"></script>

<!-- 蚊移動 -->
<script src="js/mosquitoMove.js"></script>

<!-- 蚊状態 -->
<script src="js/mosquitoState.js"></script>

<!-- 蚊描画 -->
<script src="js/mosquitoRender.js"></script>

<!-- ヒット判定 -->
<script src="js/mosquitoHit.js"></script>

<!-- プレイヤー入力 -->
<script src="js/playerInput.js"></script>

<!-- プレイヤー状態 -->
<script src="js/playerStatus.js"></script>

<!-- ゲームUI -->
<script src="js/gameUI.js"></script>

<!-- 断末演出 -->
<script src="js/death.js"></script>

<!-- ゲームオーバー -->
<script src="js/gameOver.js"></script>

<!-- スタッフロール -->
<script src="js/staffRoll.js"></script>

<!-- ゲーム制御 -->
<script src="js/game.js"></script>

</body>

</html>
